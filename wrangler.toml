name = "agent-trainer"
main = "src/index.js"
compatibility_date = "2024-08-01"

# ==============================================================================
# KV NAMESPACE CONFIGURATION
# ==============================================================================
# KV namespaces are configured automatically from environment variables during
# deployment. DO NOT add placeholder values here - they will cause deploy to fail.
#
# Required environment variables (set in Cloudflare Pages or CI):
#   - AGENTS_KV_ID: Your AGENTS_KV namespace ID
#   - TRAINING_JOBS_KV_ID: Your TRAINING_JOBS_KV namespace ID
#
# To create KV namespaces:
#   1. Go to Cloudflare Dashboard → Workers & Pages → KV
#   2. Create "agent-trainer-agents" and "agent-trainer-training-jobs"
#   3. Copy the namespace IDs
#   4. Add as environment variables in your Cloudflare Pages project
#
# For local development, run: npm run setup
# ==============================================================================

# Environment variables
[vars]
HUGGINGFACE_API_URL = "https://api-inference.huggingface.co/models"

# Secrets (set with: wrangler secret put HUGGINGFACE_API_KEY)
# HUGGINGFACE_API_KEY = "your_api_key"
