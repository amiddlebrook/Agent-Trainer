name = "agent-trainer"
main = "src/index.js"
compatibility_date = "2024-08-01"

# ==============================================================================
# SETUP REQUIRED: KV Namespace Configuration
# ==============================================================================
# The KV namespace IDs below are PLACEHOLDERS and must be replaced before deployment.
#
# OPTION 1: Local Development (Quick setup)
#   npm run setup
#
# OPTION 2: CI/CD Deployment (Cloudflare Pages, GitHub Actions, etc.)
#   The predeploy hook automatically configures wrangler.toml when these
#   environment variables are set and a CI environment is detected:
#
#   Required environment variables:
#     - AGENTS_KV_ID: Your AGENTS_KV namespace ID
#     - TRAINING_JOBS_KV_ID: Your TRAINING_JOBS_KV namespace ID
#
#   Optional environment variables:
#     - AGENTS_KV_PREVIEW_ID: Preview namespace ID (defaults to production)
#     - TRAINING_JOBS_KV_PREVIEW_ID: Preview namespace ID (defaults to production)
#
#   For Cloudflare Pages:
#     1. Create KV namespaces in Cloudflare Dashboard (Workers & Pages > KV)
#     2. Add AGENTS_KV_ID and TRAINING_JOBS_KV_ID as environment variables
#        in your Pages project settings (Settings > Environment Variables)
#     3. Deploy - configuration happens automatically!
#
#   To get namespace IDs locally:
#     wrangler kv:namespace create "AGENTS_KV"
#     wrangler kv:namespace create "TRAINING_JOBS_KV"
#
# OPTION 3: Manual setup
#   1. wrangler kv:namespace create "AGENTS_KV"
#   2. wrangler kv:namespace create "TRAINING_JOBS_KV"
#   3. wrangler kv:namespace create "AGENTS_KV" --preview
#   4. wrangler kv:namespace create "TRAINING_JOBS_KV" --preview
#   5. Replace the placeholder IDs below with the IDs from the command output
# ==============================================================================
[[kv_namespaces]]
binding = "AGENTS_KV"
id = "your_kv_namespace_id"
preview_id = "your_preview_kv_namespace_id"

[[kv_namespaces]]
binding = "TRAINING_JOBS_KV"
id = "your_training_jobs_kv_namespace_id"
preview_id = "your_preview_training_jobs_kv_namespace_id"

# Environment variables
[vars]
HUGGINGFACE_API_URL = "https://api-inference.huggingface.co/models"

# Secrets (set with: wrangler secret put HUGGINGFACE_API_KEY)
# HUGGINGFACE_API_KEY = "your_api_key"
