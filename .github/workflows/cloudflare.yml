name: Test and deploy to Cloudflare
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit and API contract tests
        run: npm test
      - name: Validate Worker bundle
        run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Reuse or provision free-tier KV namespaces
        run: npm run bootstrap:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.ci.toml
      - name: Synchronize optional workspace access secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKSPACE_ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -n "$WORKSPACE_ADMIN_TOKEN" ]; then
            printf '%s' "$WORKSPACE_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN --config wrangler.ci.toml
            echo "Workspace access configured using the ADMIN_TOKEN GitHub Actions secret."
          else
            echo "::notice::No ADMIN_TOKEN GitHub Actions secret supplied. Existing Cloudflare Worker secret (if any) is preserved."
          fi
      - name: Verify deployed Worker endpoints
        run: node scripts/smoke.mjs https://agent-trainer.averymiddlebrook2014.workers.dev
